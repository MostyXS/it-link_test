---
- name: Install common packages
  ansible.builtin.apt:
    name:
      - openssh-server
      - ufw
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Create admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups:
      - sudo
    append: true
    shell: /bin/bash
    create_home: true
    state: present

- name: Allow admin user to use sudo without password
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ admin_user }}"
    owner: root
    group: root
    mode: "0440"
    content: |
      {{ admin_user }} ALL=(ALL) NOPASSWD:ALL

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Install SSH key for managed users
  ansible.posix.authorized_key:
    user: "{{ item }}"
    key: "{{ ssh_public_key }}"
    state: present
  loop:
    - "{{ admin_user }}"
    - "{{ deploy_user }}"

- name: Install SSH hardening drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      PermitRootLogin no
  notify: Restart ssh

- name: Set default incoming firewall policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set default outgoing firewall policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH from management network
  community.general.ufw:
    rule: allow
    src: "{{ management_cidr }}"
    port: "22"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled
